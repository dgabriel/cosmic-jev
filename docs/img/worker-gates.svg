<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 690" role="img" aria-label="Every POST /api/decide passes the Worker's gates in order: origin allowlist, method, content type and size, body shape, per-IP spend cap. Only after all of them pass does the Worker attach the model and the OpenRouter key and call upstream, then it forwards a whitelisted reply and charges the reply's cost to the caller's IP bucket.">
  <style>
    svg { --bg: #ffffff; --fg: #1f2330; --muted: #6b7080; --line: #c9ccd6; --accent: #6d28d9; --accent-bg: #f1ebfd; --err: #b4232f; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #14161d; --fg: #e8e9ee; --muted: #9a9fb0; --line: #3a3e4c; --accent: #b79cff; --accent-bg: #2a2140; --err: #ff8a8f; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .key { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2; }
    .fail { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .ok { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .flow { stroke: var(--fg); stroke-width: 1.6; fill: none; }
    .exit { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .head { fill: var(--fg); }
    .head2 { fill: var(--muted); }
    text { fill: var(--fg); font-size: 13px; }
    .title { font-size: 18px; font-weight: 700; }
    .num { fill: var(--muted); font-size: 12px; font-weight: 700; }
    .h { font-weight: 700; }
    .sub { fill: var(--muted); font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: var(--err); }
    .acc { fill: var(--accent); font-weight: 700; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head2" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="860" height="690"/>
  <text class="title" x="30" y="34">Inside the Worker: gates before the key is used</text>
  <text class="sub" x="30" y="54">Each POST /api/decide, top to bottom. A failed gate answers immediately; nothing reaches OpenRouter.</text>

  <!-- column x=40..470, rows every 76 starting y=72, box h=54 -->
  <!-- 1 -->
  <rect class="box" x="40" y="72" width="430" height="54" rx="8"/>
  <text class="num" x="56" y="104">1</text>
  <text class="h" x="76" y="95">Origin on the allowlist?</text>
  <text class="sub" x="76" y="113">dawngabriel.com · github.io · localhost · 2 extension IDs</text>
  <line class="exit" x1="470" y1="99" x2="548" y2="99" marker-end="url(#ah2)"/>
  <rect class="fail" x="550" y="84" width="280" height="30" rx="6"/>
  <text class="code" x="564" y="104">403 origin_not_allowed</text>
  <line class="flow" x1="255" y1="126" x2="255" y2="146" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect class="box" x="40" y="148" width="430" height="54" rx="8"/>
  <text class="num" x="56" y="180">2</text>
  <text class="h" x="76" y="171">POST, application/json, ≤ 8 KB?</text>
  <text class="sub" x="76" y="189">JSON content type also forces a CORS preflight</text>
  <line class="exit" x1="470" y1="175" x2="548" y2="175" marker-end="url(#ah2)"/>
  <rect class="fail" x="550" y="160" width="280" height="30" rx="6"/>
  <text class="code" x="564" y="180">405 · 415 · 413 · 400 invalid_json</text>
  <line class="flow" x1="255" y1="202" x2="255" y2="222" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect class="box" x="40" y="224" width="430" height="54" rx="8"/>
  <text class="num" x="56" y="256">3</text>
  <text class="h" x="76" y="247">Body is exactly { state, questions }?</text>
  <text class="sub" x="76" y="265">≤ 8 typed questions · a client-sent model is rejected</text>
  <line class="exit" x1="470" y1="251" x2="548" y2="251" marker-end="url(#ah2)"/>
  <rect class="fail" x="550" y="236" width="280" height="30" rx="6"/>
  <text class="code" x="564" y="256">400 invalid_request</text>
  <line class="flow" x1="255" y1="278" x2="255" y2="298" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect class="box" x="40" y="300" width="430" height="54" rx="8"/>
  <text class="num" x="56" y="332">4</text>
  <text class="h" x="76" y="323">IP bucket under its spend cap?</text>
  <text class="sub" x="76" y="341">$0.01 per rolling 7 days · SQLite Durable Object</text>
  <line class="exit" x1="470" y1="327" x2="548" y2="327" marker-end="url(#ah2)"/>
  <rect class="fail" x="550" y="304" width="280" height="46" rx="6"/>
  <text class="code" x="564" y="323">429 rate_limited</text>
  <text class="code" x="564" y="341">503 if the ledger is down</text>
  <line class="flow" x1="255" y1="354" x2="255" y2="374" marker-end="url(#ah)"/>

  <!-- 5 key -->
  <rect class="key" x="40" y="376" width="430" height="70" rx="8"/>
  <text class="num" x="56" y="416">5</text>
  <text class="acc" x="76" y="400">Add model + Bearer key, call OpenRouter</text>
  <text x="76" y="419" font-size="12">model = JEV_MODEL (typesafe/jev-1.13)</text>
  <text class="sub" x="76" y="436">up to 3 tries · 250 → 500 ms backoff · 10 s timeout</text>
  <line class="exit" x1="470" y1="411" x2="548" y2="411" marker-end="url(#ah2)"/>
  <rect class="fail" x="550" y="380" width="280" height="62" rx="6"/>
  <text class="code" x="564" y="398">429 upstream busy</text>
  <text class="code" x="564" y="415">503 key / credits (401·402·403)</text>
  <text class="code" x="564" y="432">502 upstream_error</text>
  <line class="flow" x1="255" y1="446" x2="255" y2="466" marker-end="url(#ah)"/>

  <!-- 6 -->
  <rect class="box" x="40" y="468" width="430" height="54" rx="8"/>
  <text class="num" x="56" y="500">6</text>
  <text class="h" x="76" y="491">Keep only id, model, provider, answers, usage</text>
  <text class="sub" x="76" y="509">a 200 without an answers object counts as a failure</text>
  <line class="exit" x1="470" y1="495" x2="548" y2="495" marker-end="url(#ah2)"/>
  <rect class="fail" x="550" y="480" width="280" height="30" rx="6"/>
  <text class="code" x="564" y="500">502 upstream_error</text>
  <line class="flow" x1="255" y1="522" x2="255" y2="542" marker-end="url(#ah)"/>

  <!-- 7 -->
  <rect class="box" x="40" y="544" width="430" height="54" rx="8"/>
  <text class="num" x="56" y="576">7</text>
  <text class="h" x="76" y="567">Charge usage.cost to the IP bucket</text>
  <text class="sub" x="76" y="585">after the reply, via waitUntil · a meter failure never fails it</text>
  <line class="flow" x1="255" y1="598" x2="255" y2="626" marker-end="url(#ah)"/>

  <rect class="ok" x="155" y="628" width="200" height="36" rx="18"/>
  <text class="h" x="255" y="651" text-anchor="middle">200 → browser</text>
</svg>
