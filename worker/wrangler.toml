name = "cosmic-oracle-worker"
main = "index.ts"
compatibility_date = "2026-09-26"

# Non-secret config. OPENROUTER_API_KEY is a secret: `wrangler secret put
# OPENROUTER_API_KEY` when deployed, worker/.dev.vars locally. Never put it here.
[vars]
# Exact browser origins allowed to call the Worker (an Origin has no path).
ALLOWED_ORIGINS = "https://dgabriel.github.io,http://localhost:5173"
# Pinned Jev release so the routing thresholds stay stable (docs/jev-openrouter.md).
JEV_MODEL = "typesafe/jev-1.13"
# Rolling-7-day OpenRouter spend cap per IP bucket (IPv6 collapses to /64).
# The exemption list is a secret (it names the operator's IPs):
# `npx wrangler secret put THROTTLE_EXEMPT_IPS` -- never put it here.
SPEND_CAP_USD_PER_IP = "0.01"

# SQLite-backed Durable Object: the spend ledger behind the /api/decide
# throttle and GET /api/admin/spend (see spendLedger.ts). Free-plan eligible.
[durable_objects]
bindings = [{ name = "SPEND_TRACKER", class_name = "SpendLedger" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendLedger"]
